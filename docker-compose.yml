services:
  # Python FastAPI AI OCR & Sequential Database Backend Service
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: hotel_backend
    ports:
      - "8008:8000"
    volumes:
      # Persistent Volume for SQLite Database & Uploaded Images
      - ./backend/data:/app/data
    environment:
      - PORT=8000
    restart: always
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/"]
      interval: 30s
      timeout: 10s
      retries: 3

  # React / Vite Hotel PMS Frontend Web App with Production Nginx Proxy
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: hotel_frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: always
