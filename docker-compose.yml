services:
  # PostgreSQL Database Service
  postgres_db:
    image: postgres:15-alpine
    container_name: guestbooks_postgres_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: guestbooks_pms
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d guestbooks_pms"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Python FastAPI AI OCR & Sequential Database Backend Service
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: hotel_backend
    ports:
      - "8008:8000"
    volumes:
      # Persistent Volume for SQLite Database & Uploaded Images
      - ./backend/data:/app/data
    environment:
      - PORT=8000
      - DATABASE_URL=postgresql://postgres:postgrespassword@postgres_db:5432/guestbooks_pms
    depends_on:
      postgres_db:
        condition: service_healthy
    restart: always
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/"]
      interval: 30s
      timeout: 10s
      retries: 3

  # React / Vite Hotel PMS Frontend Web App with Production Nginx Proxy
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: hotel_frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: always

volumes:
  postgres_data:



